<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Binance Leaderboard Capture</title>
    <link rel="stylesheet" href="/css888/styles.css?v=20260906f" />
    <style>
      /* ============================================================
         抓榜任务台 · 设计标尺
         暖纸 + 墨色 + 一条青色信号；台账式任务行是本页的主视觉。
         仅作用于 body.taskdesk，避免影响 styles.css 的其他页面。
         ============================================================ */
      body.taskdesk {
        --paper: #f3f0e8;
        --surface: #fffdf8;
        --surface-2: #f7f2e7;
        --ink: #2b2721;
        --ink-2: #574e43;
        --muted: #6b6255;
        --line: rgba(46, 42, 36, 0.12);
        --line-strong: rgba(46, 42, 36, 0.24);
        --accent: #0e747a;
        --accent-ink: #0a5d62;
        --accent-soft: rgba(14, 116, 122, 0.09);
        --up: #b02a24;
        --down: #1a7f4b;
        --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
        --r-card: 12px;
        --r-ctl: 6px;
        --r-tag: 4px;
        /* 兼容 styles.css 里的旧变量 */
        --bg: var(--paper);
        --panel: var(--surface);
        --panel-soft: var(--surface-2);
        --accent-2: var(--accent);
        --bad: var(--up);
        --good: var(--down);

        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .taskdesk * { box-sizing: border-box; }
      .taskdesk .sprite { display: none; }
      .taskdesk .i {
        width: 16px; height: 16px; flex: none;
        stroke: currentColor; fill: none; stroke-width: 1.5;
        stroke-linecap: round; stroke-linejoin: round;
      }
      .taskdesk .i-sm { width: 14px; height: 14px; }
      .taskdesk .i-xs { width: 12px; height: 12px; }
      .taskdesk .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

      .taskdesk label {
        display: inline-block;
        font-weight: 500;
        text-transform: none;
        letter-spacing: 0;
        font-size: 12px;
      }

      .taskdesk .shell {
        width: min(1600px, 100%);
        margin: 0 auto;
        padding: 0 24px 48px;
      }

      /* ---------- 页头 ---------- */
      .taskdesk .page-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        padding: 24px 0 18px;
      }
      .taskdesk .head-main { min-width: 0; }
      .taskdesk .kicker {
        margin: 0 0 6px;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--muted);
      }
      .taskdesk h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.25;
        font-weight: 500;
        letter-spacing: 0;
        color: var(--ink);
      }
      .taskdesk .lede {
        max-width: 680px;
        margin: 8px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
      .taskdesk .lede .mono { color: var(--ink-2); }
      .taskdesk .head-nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 2px;
        flex: none;
        max-width: 520px;
      }
      .taskdesk .head-nav a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 9px;
        border-radius: var(--r-ctl);
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        text-decoration: none;
        transition: background 140ms ease, color 140ms ease;
      }
      .taskdesk .head-nav a:hover { background: var(--surface-2); color: var(--ink); }

      /* ---------- 通用控件 ---------- */
      .taskdesk input,
      .taskdesk select {
        height: 34px;
        width: 100%;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: var(--r-ctl);
        background: var(--surface);
        color: var(--ink);
        font-family: inherit;
        font-size: 13px;
        outline: none;
      }
      .taskdesk input::placeholder { color: var(--muted); }
      .taskdesk input:focus,
      .taskdesk select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .taskdesk :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .taskdesk button {
        font-family: inherit;
        font-weight: 500;
        letter-spacing: 0;
        border-radius: var(--r-ctl);
      }
      .taskdesk .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 34px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: var(--r-ctl);
        background: var(--surface);
        color: var(--ink-2);
        font-size: 12px;
        font-weight: 500;
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
        transition: background 140ms ease, border-color 140ms ease, color 140ms ease;
      }
      .taskdesk .btn:hover { background: var(--surface-2); border-color: var(--line-strong); color: var(--ink); }
      .taskdesk .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .taskdesk .btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); color: #fff; }
      .taskdesk .btn:disabled,
      .taskdesk button:disabled { opacity: 0.45; cursor: not-allowed; }

      /* ---------- URL 发现 ---------- */
      .taskdesk .capture {
        margin: 0 0 16px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: var(--r-card);
        background: var(--surface);
      }
      .taskdesk .capture-row {
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }
      .taskdesk .url-field {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
        min-width: 0;
      }
      .taskdesk .field-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
      }
      .taskdesk #discoverBtn { min-width: 138px; }

      .taskdesk .discovery-section { margin: 14px 0 0; }
      .taskdesk .discovery-section:empty { display: none; }
      .taskdesk .discovery-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 12px;
        margin: 0 0 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .taskdesk .discovery-meta strong,
      .taskdesk .discovery-meta span {
        border: 0;
        border-radius: 0;
        background: none;
        padding: 0;
        font-size: 12px;
        color: var(--ink-2);
      }
      .taskdesk .discovery-meta code {
        border: 0;
        border-radius: 0;
        background: none;
        padding: 0;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .taskdesk .discovery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 8px;
      }
      .taskdesk .discovery-card {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        text-align: left;
        cursor: pointer;
        box-shadow: none;
        transition: border-color 140ms ease, background 140ms ease;
      }
      .taskdesk .discovery-card:hover { border-color: var(--accent); background: var(--surface-2); box-shadow: none; }
      .taskdesk .discovery-card.used { opacity: 1; }
      .taskdesk .dc-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-width: 0;
      }
      .taskdesk .dc-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 500;
        line-height: 1.35;
        color: var(--ink);
      }
      .taskdesk .discovery-card.fresh .dc-name { color: var(--ink-2); }
      .taskdesk .dc-state {
        flex: none;
        padding: 0 4px;
        border: 1px solid var(--line);
        border-radius: var(--r-tag);
        font-size: 10px;
        line-height: 16px;
        color: var(--muted);
      }
      .taskdesk .discovery-card.used .dc-state {
        border-color: rgba(14, 116, 122, 0.3);
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      .taskdesk .dc-id {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .taskdesk .dc-meta { font-size: 11px; color: var(--muted); }

      /* ---------- 任务列表 ---------- */
      .taskdesk .board {
        border: 1px solid var(--line);
        border-radius: var(--r-card);
        background: var(--surface);
        overflow: hidden;
      }
      .taskdesk .board-head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .taskdesk .board-head h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
      }
      .taskdesk #jobCount {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 22px;
        height: 20px;
        padding: 0 6px;
        border: 1px solid var(--line);
        border-radius: var(--r-tag);
        background: var(--surface-2);
        color: var(--ink-2);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      .taskdesk .filter-bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }
      .taskdesk #marketFilter {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: var(--r-ctl);
        background: var(--surface-2);
      }
      .taskdesk .filter-btn {
        min-height: 26px;
        padding: 0 10px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      .taskdesk .filter-btn:hover { background: transparent; color: var(--ink); }
      .taskdesk .filter-btn.active { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
      .taskdesk .switch {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        cursor: pointer;
        text-transform: none;
      }
      .taskdesk .switch input[type="checkbox"] {
        width: 14px;
        height: 14px;
        min-height: 0;
        margin: 0;
        padding: 0;
        accent-color: var(--accent);
      }
      .taskdesk .search {
        position: relative;
        display: flex;
        align-items: center;
        margin-left: auto;
        width: 240px;
        max-width: 100%;
      }
      .taskdesk .search .i {
        position: absolute;
        left: 9px;
        color: var(--muted);
        pointer-events: none;
      }
      .taskdesk .filter-search {
        height: 30px;
        width: 100%;
        padding: 0 10px 0 30px;
        border-radius: var(--r-ctl);
        background: var(--surface);
        font-size: 12px;
      }

      /* ---------- 台账任务行 ---------- */
      .taskdesk .job-list {
        display: block;
        gap: 0;
        background: var(--surface);
      }
      .taskdesk .job {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 0 20px;
        margin: 0;
        padding: 14px 16px 14px 18px;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        background: var(--surface);
        box-shadow: none;
        color: var(--ink);
        opacity: 1;
        filter: none;
        transition: background 120ms ease;
      }
      .taskdesk .job:last-child { border-bottom: 0; }
      .taskdesk .job:hover { background: #fbf8f2; }
      .taskdesk .job.run { background: var(--surface); }
      .taskdesk .job.run:hover { background: #fbf8f2; }
      .taskdesk .job.expired { opacity: 1; filter: none; }
      .taskdesk .job.expired .job-name::after { content: none; }
      .taskdesk .job::before { display: none; }
      .taskdesk .job.run::before,
      .taskdesk .job.fail::before,
      .taskdesk .job.pending::before {
        content: "";
        display: block;
        position: absolute;
        left: 0;
        top: 12px;
        bottom: 12px;
        width: 2px;
        border-radius: 1px;
        background: var(--line-strong);
      }
      .taskdesk .job.run::before { background: var(--accent); }
      .taskdesk .job.fail::before { background: var(--up); }

      .taskdesk .job-title-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px 8px;
        min-width: 0;
      }
      .taskdesk .job-name {
        font-size: 15px;
        font-weight: 500;
        line-height: 1.35;
        color: var(--ink);
        text-decoration: none;
        overflow-wrap: anywhere;
        cursor: pointer;
      }
      .taskdesk .job-name:hover {
        color: var(--accent-ink);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }
      .taskdesk .job-rid {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .taskdesk .sprint-badge {
        margin: 0;
        padding: 0 4px;
        border: 1px solid var(--line);
        border-radius: var(--r-tag);
        background: var(--surface-2);
        color: var(--ink-2);
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 500;
        line-height: 16px;
      }

      .taskdesk .job-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px 10px;
        min-width: 0;
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
      }
      .taskdesk .job-time {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .taskdesk .job-time .i { width: 12px; height: 12px; color: var(--muted); }
      .taskdesk .job-countdown {
        margin: 0;
        padding: 0 5px;
        border: 1px solid var(--line);
        border-radius: var(--r-tag);
        background: transparent;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        line-height: 17px;
        font-variant-numeric: tabular-nums;
      }
      .taskdesk .job-countdown.urgent {
        border-color: rgba(176, 42, 36, 0.35);
        background: rgba(176, 42, 36, 0.07);
        color: var(--up);
      }
      .taskdesk .job-countdown.pre,
      .taskdesk .job-countdown.ended {
        border-color: var(--line);
        background: transparent;
        color: var(--muted);
      }
      .taskdesk .job-expired-tag {
        display: inline-flex;
        align-items: center;
        height: 17px;
        padding: 0 5px;
        border: 1px solid var(--line);
        border-radius: var(--r-tag);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        line-height: 1;
      }
      .taskdesk .job-urls { display: inline-flex; gap: 10px; margin: 0; }
      .taskdesk .job-urls .job-link {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: none;
        color: var(--accent-ink);
        font-size: 11px;
        font-weight: 500;
        text-decoration: none;
      }
      .taskdesk .job-urls .job-link:hover {
        background: none;
        color: var(--accent-ink);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .taskdesk .job-urls .muted { font-size: 11px; color: var(--muted); }

      .taskdesk .job-state {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px 10px;
        margin-top: 5px;
        font-size: 11px;
        color: var(--muted);
      }
      .taskdesk .job-status {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-weight: 500;
        color: var(--ink-2);
      }
      .taskdesk .job.run .job-status { color: var(--accent-ink); }
      .taskdesk .job.fail .job-status { color: var(--up); }
      .taskdesk .job.pending .job-status { color: var(--muted); }
      .taskdesk .st-dot {
        display: none;
        width: 6px;
        height: 6px;
        border-radius: 1px;
        background: var(--accent);
      }
      .taskdesk .job.run .st-dot { display: inline-block; }
      .taskdesk .job-finished {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .taskdesk .job-finished::before { content: "·"; margin-right: 10px; color: var(--line-strong); }
      .taskdesk .job-snapshot {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .taskdesk .job-snapshot::before { content: "·"; margin-right: 10px; color: var(--line-strong); }
      .taskdesk .job-snapshot b { font-weight: 500; color: var(--ink-2); }

      .taskdesk .job-progress {
        grid-column: 1 / -1;
        display: grid;
        gap: 5px;
        max-width: 560px;
        margin-top: 8px;
      }
      .taskdesk .jp-line {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .taskdesk .jp-line b { font-weight: 500; color: var(--ink-2); }
      .taskdesk .jp-track {
        height: 3px;
        border-radius: 2px;
        background: var(--surface-2);
        overflow: hidden;
      }
      .taskdesk .jp-track i {
        display: block;
        height: 100%;
        border-radius: 2px;
        background: var(--accent);
        transition: width 240ms ease;
      }

      .taskdesk .job-actions {
        display: flex;
        align-items: flex-start;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0;
      }
      .taskdesk .job-actions button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 28px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: var(--r-ctl);
        background: var(--surface);
        color: var(--ink-2);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
        transition: background 140ms ease, border-color 140ms ease, color 140ms ease;
      }
      .taskdesk .job-actions button:hover {
        background: var(--surface-2);
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .taskdesk .job-actions button.act-run {
        border-color: rgba(14, 116, 122, 0.35);
        color: var(--accent-ink);
      }
      .taskdesk .job-actions button.act-run:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
      .taskdesk .job-actions button.danger:hover {
        border-color: rgba(176, 42, 36, 0.35);
        background: rgba(176, 42, 36, 0.06);
        color: var(--up);
      }

      .taskdesk .job-error {
        grid-column: 1 / -1;
        margin-top: 8px;
        padding: 7px 10px;
        border-left: 2px solid var(--up);
        border-radius: 0 var(--r-tag) var(--r-tag) 0;
        background: rgba(176, 42, 36, 0.06);
        color: var(--up);
        font-family: var(--mono);
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      .taskdesk .job details.stderr { grid-column: 1 / -1; margin-top: 6px; }
      .taskdesk .job details.stderr summary {
        cursor: pointer;
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        user-select: none;
      }
      .taskdesk .job details.stderr summary:hover { color: var(--up); }
      .taskdesk .job details.stderr pre {
        max-height: 160px;
        overflow: auto;
        margin: 4px 0 0;
        padding: 10px;
        border: 1px solid rgba(176, 42, 36, 0.16);
        border-radius: var(--r-ctl);
        background: rgba(176, 42, 36, 0.06);
        color: var(--up);
        font-size: 11px;
        white-space: pre-wrap;
      }

      /* ---------- 轮次任务折叠 ---------- */
      .taskdesk .sprint-group { margin: 0; border-bottom: 1px solid var(--line); }
      .taskdesk .sprint-group > .job { border-bottom: 0; }
      .taskdesk .job-sprint {
        grid-column: 1 / -1;
        margin-top: 10px;
        border-top: 1px solid var(--line);
      }
      .taskdesk .sprint-toggle {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        min-height: 36px;
        margin: 0;
        padding: 0;
        border: 0;

              <label class="form-grow">最新活动公告
                <div class="article-picker-line">
                  <select id="articlePick" class="article-pick-select"><option value="">选择公告…</option></select>
                  <button id="extractArticleBtn" type="button">提取</button>
                </div>
              </label>
            </div>
            <div id="articleExtractStatus" class="article-extract-status"></div>
            <hr class="form-divider">
            <div class="form-row">
              <label class="form-grow">任务名
                <input id="editName" placeholder="SPOT CELO" />
              </label>
            </div>
            <hr class="form-divider">
            <div class="form-row">
              <label>Market
                <select id="editMarket"><option value="um">UM</option><option value="spot">SPOT</option><option value="saving">SAVING</option><option value="sprint">SPRINT（限时冲刺）</option></select>
              </label>
              <label>Token
                <input id="editToken" placeholder="CELO" />
              </label>
              <label>Symbol
                <input id="editSymbol" placeholder="BTCUSDT, ETHUSDT（逗号分隔）" />
              </label>
            </div>
            <div class="form-row">
              <label>活动开始
                <input id="editActivityStart" type="datetime-local" />
              </label>
              <label>活动结束
                <input id="editActivityEnd" type="datetime-local" />
              </label>
              <label>抓取行数
                <input id="editTop" type="number" min="1" max="10000" value="1000" />
              </label>
            </div>
            <hr class="form-divider">
            <div id="sprintSection">
              <div class="form-row">
                <label>第一轮 起始时间
                  <input id="editSprint1Start" type="datetime-local" disabled />
                </label>
                <label>第一轮 结束时间
                  <input id="editSprint1End" type="datetime-local" disabled />
                </label>
                <label>第一轮 资源ID
                  <input id="editSprint1ResourceId" placeholder="缺省 任务ID+2" />
                </label>
              </div>
              <div class="form-row">
                <label>第二轮 起始时间
                  <input id="editSprint2Start" type="datetime-local" disabled />
                </label>
                <label>第二轮 结束时间
                  <input id="editSprint2End" type="datetime-local" disabled />
                </label>
                <label>第二轮 资源ID
                  <input id="editSprint2ResourceId" placeholder="缺省 任务ID+4" />
                </label>
              </div>
              <div id="sprintTiersPreview" style="font-size:11px;color:var(--muted);margin-top:4px"></div>
              <div style="display:flex;align-items:center;gap:10px;margin-top:6px">
                <button id="syncSprintsBtn" type="button" class="tier-add-btn"><svg class="i i-sm" aria-hidden="true"><use href="#i-refresh"/></svg>同步轮次任务</button>
                <span id="syncSprintsHint" style="font-size:11px;color:var(--muted)"></span>
              </div>
            </div>
          </div>
          <div id="tabReward" class="tab-content" style="display:none">
            <div class="form-row">
              <label>奖励币种
                <input id="editRewardToken" placeholder="BANK" />
              </label>
              <label>奖励方式
                <select id="editRewardMode">
                  <option value="rank">按排名</option>
                  <option value="rank_last_volume">按排名（末档按量）</option>
                  <option value="total">按总量</option>
                </select>
              </label>
              <label></label>
            </div>
            <hr class="form-divider">
            <div id="rewardRankFields">
              <div class="tier-header"><span>档位</span><span>下限</span><span>~</span><span>上限</span><span> </span><span>奖励数量</span><span style="width:24px"></span></div>
              <div id="editTierRows"></div>
              <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
                <button id="addTierBtn" type="button" class="tier-add-btn"><svg class="i i-sm" aria-hidden="true"><use href="#i-plus"/></svg>添加档位</button>
                <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:0">
                  <select id="tierPresetSelect" style="padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#fffdf8;color:var(--ink);font-size:12px">
                    <option value="">选择预设...</option>
                  </select>
                </label>
              </div>
              <div id="lastTierCapField" style="display:none;margin-top:10px;align-items:center;gap:10px;font-size:12px;color:var(--muted)">
                <label for="editLastTierCap" style="margin:0;display:flex;align-items:center;gap:6px">
                  末档个人上限
                  <input id="editLastTierCap" type="number" step="any" placeholder="如 0.05" style="width:120px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#fffdf8;color:var(--ink);font-size:12px" />
                </label>
                <span>按交易量折算后每人不超过此数量</span>
              </div>
            </div>
            <div id="rewardTotalFields" style="display:none">
              <div class="form-row">
                <label>总奖池
                  <input id="editTotalReward" type="text" inputmode="numeric" placeholder="10,000" />
                </label>
                <label>有效用户数
                  <input id="editEligibleUsers" type="text" inputmode="numeric" placeholder="200" />
                </label>
                <label></label>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button id="editCancelBtn" type="button">取消</button>
          <button id="editSaveBtn" type="button">保存</button>
        </div>
      </div>
    </div>

    <script src="/css888/app.js?v=20261010b"></script>
  </body>
</html>
