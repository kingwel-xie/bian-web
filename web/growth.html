<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>已完成任务增长对比</title>
<link rel="stylesheet" href="/css888/styles.css?v=20260705" />
<style>
  .page-head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .market-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--muted); padding: 0 16px; cursor: pointer; font-weight: 700; font-size: 13px; user-select: none; }
  .market-btn:hover { background: #f5f0e8; }
  .market-btn.active { background: #e1f3f6; color: var(--accent-2); border-color: var(--accent-2); }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: #fffdf8; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid rgba(46,42,36,0.1); padding: 5px 8px; text-align: left; white-space: nowrap; font-size: 12px; }
  th { position: sticky; top: 0; z-index: 2; background: #eee7d9; color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; user-select: none; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:hover td { background: #f5f0e8; }
  .job-name { font-weight: 700; font-size: 12px; }
  .growth-pos { color: var(--good); font-weight: 700; }
  .growth-neg { color: var(--bad); font-weight: 700; }
  .growth-zero { color: var(--muted); }
  .summary { margin: 8px 0; font-size: 13px; color: var(--muted); }
  .foot-row td { background: #eee7d9; font-weight: 700; border-top: 2px solid var(--line-strong); }
  .foot-row:hover td { background: #ddd5c5; }
  .empty { color: var(--muted); text-align: center; padding: 18px; }
  .job-row td:first-child { padding-left: 12px; }
  .job-row .job-label { font-size: 13px; font-weight: 700; }
  .tier-label { color: var(--muted); font-size: 11px; }
  .job-selector { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .job-selector button { font-size: 12px; padding: 4px 12px; border: 1px solid #bbb; border-radius: 20px; background: #fff; color: #666; cursor: pointer; white-space: nowrap; transition: all .15s; }
  .job-selector button:hover { background: #e8f5e9; border-color: #81c784; color: #388e3c; }
  .job-selector button.selected { background: #81c784; border-color: #66bb6a; color: #fff; font-weight: 700; }
  .analysis-panel { border: 1px solid var(--line); border-radius: 8px; background: #fffdf8; padding: 14px; margin-top: 14px; }
  .chart-wrap { overflow-x: auto; }
  .chart-wrap svg { display: block; }
  .bar-group-label { font-size: 10px; fill: #666; text-anchor: middle; }
  .bar-rect { cursor: pointer; }
  .bar-rect:hover { stroke: #333; stroke-width: 1.5; }
  .chart-group-btn { font-size: 11px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; min-height: auto; font-weight: 700; }
  .chart-group-btn:hover { background: #f5f0e8; }
  .chart-group-btn.active { background: #4a7c8c; color: #fff; border-color: #4a7c8c; }
  .chart-axis-label { font-size: 11px; fill: #333; text-anchor: middle; }
  .chart-tooltip { position: fixed; background: rgba(0,0,0,.8); color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 4px; pointer-events: none; white-space: nowrap; z-index: 100; }
</style>
</head>
<body>
<div id="app">
  <div class="page-head">
    <h2>已完成任务分档成交量增长对比 <a href="/" style="font-size:12px;font-weight:400;color:var(--accent-2);margin-left:12px">← 返回主页</a></h2>
    <div>
      <button class="market-btn active" data-market="spot">SPOT</button>
      <button class="market-btn" data-market="um">UM</button>
    </div>
  </div>
  <hr class="sep" />
  <div id="summary" class="summary">加载中...</div>
  <div id="jobSelector" class="job-selector" style="display:none"></div>
  <div class="table-wrap">
    <table>
      <thead><tr id="headerRow"></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div class="analysis-panel" id="pctTrendPanel" style="display:none">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px">
      <h3 style="margin:0;font-size:13px;color:var(--accent)">最后 4h：增量占比 vs 占比变化</h3>
      <div id="pctTrendHours" class="btn-group">
        <button class="chart-group-btn" data-hours="2">2h</button>
        <button class="chart-group-btn active" data-hours="4">4h</button>
        <button class="chart-group-btn" data-hours="6">6h</button>
      </div>
      <div id="pctTrendGroupToggle" class="btn-group" style="margin-left:auto">
        <button class="chart-group-btn active" data-mode="tier">按排名分档</button>
        <button class="chart-group-btn" data-mode="job">按任务分组</button>
      </div>
      <button id="loadPctTrendBtn" style="font-size:12px;padding:2px 14px;min-height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--muted);cursor:pointer;font-weight:700;user-select:none">加载趋势数据</button>
      <span id="pctTrendStatus" style="font-size:11px;color:var(--muted)"></span>
    </div>
    <div class="chart-wrap">
      <svg id="pctTrendChart" height="360"></svg>
    </div>
  </div>
</div>

<script>
function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"]/g, function(m) { return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]; });
}

const marketBtns = document.querySelectorAll(".market-btn");
let currentMarket = "spot";
let allJobs = [];
let selectedJobIds = [];
let _cachedRangeLabels = [];

// pctTrend state
let _pctTrendHours = 4;
let _pctTrendGroupBy = "tier";
let _pctTrendPoints = [];

marketBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    marketBtns.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentMarket = btn.dataset.market;
    loadData();
  });
});

async function loadData() {
  document.getElementById("summary").textContent = "加载中...";
  document.getElementById("tableBody").innerHTML = "";
  document.getElementById("headerRow").innerHTML = "";
  try {
    const resp = await fetch("/api/jobs/completed-growth?market=" + encodeURIComponent(currentMarket));
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    renderGrowth(data);
  } catch (err) {
    document.getElementById("summary").textContent = "加载失败: " + err.message;
  }
}

function renderGrowth(data) {
  allJobs = data.jobs || [];
  _cachedRangeLabels = data.rangeLabels || [];
  if (!allJobs.length) {
    document.getElementById("summary").textContent = "没有符合条件的已完成任务。";
    document.getElementById("jobSelector").style.display = "none";
    document.getElementById("pctTrendPanel").style.display = "none";
    return;
  }
  selectedJobIds = allJobs.slice(0, 3).map(j => j.id);
  renderJobSelector();
  updateGrowthTable();
  showPctTrendPanel();
}

function renderJobSelector() {
  const sel = document.getElementById("jobSelector");
  sel.style.display = "flex";
  sel.innerHTML = allJobs.map((j, i) =>
    `<button class="${selectedJobIds.includes(j.id) ? 'selected' : ''}" data-idx="${i}">${escapeHtml(j.name || j.id)}</button>`
  ).join("");
  sel.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = parseInt(btn.dataset.idx);
      const id = allJobs[idx].id;
      const pos = selectedJobIds.indexOf(id);
      if (pos >= 0) {
        selectedJobIds.splice(pos, 1);
        btn.classList.remove("selected");
      } else {
        selectedJobIds.push(id);
        btn.classList.add("selected");
      }
      if (selectedJobIds.length === 0) {
        selectedJobIds.push(id);
        btn.classList.add("selected");
        return;
      }
      updateGrowthTable();
      showPctTrendPanel();
    });
  });
}

function updateGrowthTable() {
  const visible = allJobs.filter(j => selectedJobIds.includes(j.id));
  const rangeLabels = _cachedRangeLabels;
  document.getElementById("summary").textContent = "共 " + allJobs.length + " 个任务，显示 " + visible.length + " 个。" + (currentMarket === "spot" ? "对比 T-2h 与 T 分档占比增长。" : "对比 T-1 与 T 分档 grade 增长。");

  // Header
  const headerRow = document.getElementById("headerRow");
  let headerHtml = "<th style='width:100px'>任务</th><th style='width:60px'>分档</th>";
  for (const rl of rangeLabels) {
    headerHtml += `<th class="num" colspan="3">${escapeHtml(rl)}</th>`;
  }
  headerRow.innerHTML = headerHtml;

  const existingSub = headerRow.parentNode.querySelector(".sub-header");
  if (existingSub) existingSub.remove();

  const isSpot = currentMarket === "spot";
  const prevLabel = isSpot ? "T-2h%" : "T-1均值";
  const curLabel = isSpot ? "T%" : "T均值";
  let subHtml = "<th></th><th></th>";
  for (const _ of rangeLabels) {
    subHtml += `<th class="num" style="font-weight:400">${prevLabel}</th><th class="num" style="font-weight:400">${curLabel}</th><th class="num" style="font-weight:400">增长</th>`;
  }
  const subRow = document.createElement("tr");
  subRow.className = "sub-header";
  subRow.innerHTML = subHtml;
  headerRow.parentNode.insertBefore(subRow, headerRow.nextSibling);

  // Body
  const tbody = document.getElementById("tableBody");
  let html = "";

  for (const job of visible) {
    const tiers = job.tiers || [];
    html += `<tr class="job-row"><td class="job-label">${escapeHtml(job.name)}</td><td></td>`;
    for (const t of tiers) {
      const prevVal = isSpot ? t.prevPct : t.prevAvg;
      const curVal = isSpot ? t.curPct : t.curAvg;
      const growthVal = isSpot ? t.pctGrowth : t.avgGrowth;
      const cls = growthVal > 0 ? "growth-pos" : growthVal < 0 ? "growth-neg" : "growth-zero";
      const sign = growthVal > 0 ? "+" : "";
      const fmt = isSpot ? v => v.toFixed(2) : v => Number(v).toLocaleString("en-US", {minimumFractionDigits:2,maximumFractionDigits:2});
      html += `<td class="num">${fmt(prevVal)}</td><td class="num">${fmt(curVal)}</td><td class="num ${cls}">${sign}${fmt(growthVal)}</td>`;
    }
    html += "</tr>";
  }

  // Footer row: average across visible jobs
  html += '<tr class="foot-row"><td colspan="2" style="font-size:12px">平均增长</td>';
  for (let ti = 0; ti < rangeLabels.length; ti++) {
    let sumGrowth = 0, count = 0;
    for (const job of visible) {
      const t = job.tiers[ti];
      if (t) { sumGrowth += isSpot ? t.pctGrowth : t.avgGrowth; count++; }
    }
    const avg = count > 0 ? sumGrowth / count : 0;
    const cls = avg > 0 ? "growth-pos" : avg < 0 ? "growth-neg" : "growth-zero";
    const sign = avg > 0 ? "+" : "";
    html += `<td class="num">—</td><td class="num">—</td><td class="num ${cls}">${sign}${avg.toFixed(2)}</td>`;
  }
  html += "</tr>";

  tbody.innerHTML = html;
}

// ——— pctTrend ———
function showPctTrendPanel() {
  const panel = document.getElementById("pctTrendPanel");
  panel.style.display = selectedJobIds.length ? "" : "none";
}

function loadPctTrendData() {
  const visible = allJobs.filter(j => selectedJobIds.includes(j.id));
  const status = document.getElementById("pctTrendStatus");
  const btn = document.getElementById("loadPctTrendBtn");
  btn.disabled = true;
  status.textContent = "加载中...";
  const promises = visible.map(j =>
    fetch("/api/jobs/" + encodeURIComponent(j.id) + "/trend?hours=" + _pctTrendHours)
      .then(r => r.ok ? r.json() : null)
  );
  Promise.all(promises).then(results => {
    _pctTrendPoints = [];
    let jobCount = 0;
    for (let ji = 0; ji < visible.length; ji++) {
      const r = results[ji];
      if (!r || !r.pctTrend || !r.pctTrend.ranges) continue;
      jobCount++;
      for (const tr of r.pctTrend.ranges) {
        if (tr.deltaPctOfTotal == null || tr.pctChange == null) continue;
        _pctTrendPoints.push({
          jobName: visible[ji].name || visible[ji].id,
          label: tr.label,
          x: tr.deltaPctOfTotal,
          y: tr.pctChange,
        });
      }
    }
    if (!_pctTrendPoints.length) {
      status.textContent = "无趋势数据";
    } else {
      status.textContent = `已加载 ${jobCount} 个任务 ${_pctTrendPoints.length} 个数据点`;
    }
    renderPctTrendChart();
    btn.disabled = false;
  }).catch(err => {
    status.textContent = "加载失败: " + err.message;
    btn.disabled = false;
  });
}

function renderPctTrendChart() {
  const chartEl = document.getElementById("pctTrendChart");
  const points = _pctTrendPoints;
  const groupBy = _pctTrendGroupBy;
  if (!points.length) {
    chartEl.innerHTML = '<text x="280" y="180" text-anchor="middle" fill="#999" font-size="13">无趋势数据</text>';
    chartEl.setAttribute("width", 560);
    chartEl.setAttribute("height", 360);
    return;
  }

  const rowMap = {};
  for (const p of points) {
    const key = groupBy === "tier" ? p.label : p.jobName;
    if (!rowMap[key]) rowMap[key] = { label: key, items: [] };
    rowMap[key].items.push(p);
  }
  const rows = Object.values(rowMap);
  const maxY = Math.max(0, ...points.map(p => p.x)) * 1.1 || 1;
  const maxAbs = Math.max(0.01, ...points.map(p => Math.abs(p.y)));

  const maxBars = Math.max(...rows.map(r => r.items.length));
  const W = 60 + rows.length * (maxBars * 20 + 24);
  const H = 360, ML = 60, MR = 20, MT = 20, MB = 60;
  const PW = W - ML - MR;
  const PH = H - MT - MB;
  const groupW = PW / rows.length;
  const barW = Math.min(16, groupW / maxBars - 2);

  function sy(v) { return MT + PH - (v / maxY) * PH; }
  function pctColor(v) {
    if (v === 0) return '#999';
    const t = Math.abs(v) / maxAbs;
    const o = (0.2 + t * 0.8).toFixed(2);
    return v > 0 ? `rgba(39,174,96,${o})` : `rgba(192,57,43,${o})`;
  }
  function pctTextColor(v) {
    if (Math.abs(v) < 0.05) return '#999';
    return v > 0 ? '#27ae60' : '#c0392b';
  }

  let svg = '<defs><linearGradient id="pctGrad" x1="0" y1="0" x2="1" y2="0">';
  svg += '<stop offset="0%" stop-color="rgba(192,57,43,0.85)"/>';
  svg += '<stop offset="50%" stop-color="#bbb"/>';
  svg += '<stop offset="100%" stop-color="rgba(39,174,96,0.85)"/>';
  svg += '</linearGradient></defs>';

  svg += `<line x1="${ML}" y1="${MT}" x2="${ML}" y2="${MT + PH}" stroke="#ccc"/>`;
  for (let i = 0; i <= 4; i++) {
    const v = maxY * i / 4;
    const y = sy(v);
    svg += `<line x1="${ML - 4}" y1="${y}" x2="${ML}" y2="${y}" stroke="#ccc"/>`;
    svg += `<text x="${ML - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="#666">${v.toFixed(1)}</text>`;
  }
  svg += `<text class="chart-axis-label" x="14" y="${MT + PH / 2}" transform="rotate(-90,14,${MT + PH / 2})">增量占比 (%)</text>`;

  svg += `<line x1="${ML}" y1="${MT + PH}" x2="${ML + PW}" y2="${MT + PH}" stroke="#ccc"/>`;

  for (let ri = 0; ri < rows.length; ri++) {
    const r = rows[ri];
    const gx = ML + ri * groupW;
    const label = r.label.length > 10 ? r.label.slice(0, 9) + '…' : r.label;
    svg += `<text class="bar-group-label" x="${gx + groupW / 2}" y="${MT + PH + 18}">${escapeHtml(label)}</text>`;

    const totalW = r.items.length * barW + (r.items.length - 1) * 4;
    const startX = gx + (groupW - totalW) / 2;

    for (let bi = 0; bi < r.items.length; bi++) {
      const p = r.items[bi];
      const bh = Math.max((p.x / maxY) * PH, 1);
      const bx = startX + bi * (barW + 4);
      const by = sy(p.x);
      const tip = escapeHtml(`${p.jobName}　${p.label}　增量占比: ${p.x.toFixed(2)}%　占比变化: ${p.y.toFixed(2)}pp`);
      const pctStr = (p.y >= 0 ? '+' : '') + p.y.toFixed(1);

      svg += `<rect class="bar-rect" x="${bx}" y="${by}" width="${barW}" height="${Math.max(bh, 1)}" fill="${pctColor(p.y)}" rx="2"
        onmouseenter="showBarTip(event,'${tip}')"
        onmousemove="moveBarTip(event)"
        onmouseleave="hideBarTip()"/>`;
      svg += `<text x="${bx + barW / 2}" y="${by - 3}" text-anchor="middle" font-size="9" fill="${pctTextColor(p.y)}">${pctStr}pp</text>`;
    }
  }

  const Lx = ML + PW + 10, Ly = MT + 8;
  svg += `<rect x="${Lx}" y="${Ly}" width="110" height="12" fill="url(#pctGrad)" rx="2"/>`;
  const lc = Lx + 55;
  svg += `<text x="${Lx + 4}" y="${Ly + 24}" font-size="10" fill="#c0392b">下降</text>`;
  svg += `<text x="${lc}" y="${Ly + 24}" text-anchor="middle" font-size="10" fill="#999">0</text>`;
  svg += `<text x="${Lx + 106}" y="${Ly + 24}" text-anchor="end" font-size="10" fill="#27ae60">增长</text>`;

  const W2 = Lx + 120 + MR;

  chartEl.setAttribute("width", Math.max(W2, 400));
  chartEl.setAttribute("height", Math.max(H, 120));
  chartEl.innerHTML = svg;
}

// Tooltip
let _barTip = null;
function showBarTip(evt, html) {
  if (!_barTip) {
    _barTip = document.createElement("div");
    _barTip.className = "chart-tooltip";
    document.body.appendChild(_barTip);
  }
  _barTip.style.display = "";
  _barTip.innerHTML = html.replace(/\n/g, "<br>");
  _barTip.style.left = (evt.clientX + 14) + "px";
  _barTip.style.top = (evt.clientY - 8) + "px";
}
function moveBarTip(evt) {
  if (_barTip) {
    _barTip.style.left = (evt.clientX + 14) + "px";
    _barTip.style.top = (evt.clientY - 8) + "px";
  }
}
function hideBarTip() {
  if (_barTip) _barTip.style.display = "none";
}

// pctTrend event handlers
document.getElementById("pctTrendHours").addEventListener("click", evt => {
  const btn = evt.target.closest(".chart-group-btn");
  if (!btn || btn.classList.contains("active")) return;
  document.querySelectorAll("#pctTrendHours .chart-group-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  _pctTrendHours = parseInt(btn.dataset.hours);
});

document.getElementById("pctTrendGroupToggle").addEventListener("click", evt => {
  const btn = evt.target.closest(".chart-group-btn");
  if (!btn || btn.classList.contains("active")) return;
  document.querySelectorAll("#pctTrendGroupToggle .chart-group-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  _pctTrendGroupBy = btn.dataset.mode;
  renderPctTrendChart();
});

document.getElementById("loadPctTrendBtn").addEventListener("click", loadPctTrendData);

loadData();
</script>
</body>
</html>
